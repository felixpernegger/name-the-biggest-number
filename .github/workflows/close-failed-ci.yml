name: Close failed CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  close:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull requests from the failed run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" \
            --jq '.pull_requests[].number' | while read -r pr_number; do
              gh pr close "$pr_number" --repo "$REPOSITORY" \
                --comment "Closing automatically because CI did not pass."
            done
